[project]
name = "prefix-serve"
version = "0.0.1"
description = "Prefix-aware LLM serving control plane: trace-driven simulator (stage 0), router + workers later"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8"]
# the real-engine harness (real/): an http client for the engines, zmq for
# vllm's kv events, msgspec for their msgpack encoding. optional so the
# simulator and its tests never need them
real = ["httpx>=0.27", "pyzmq>=26", "msgspec>=0.18"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sim", "real"]
